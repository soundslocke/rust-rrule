name: CI

on:
  push:
    branches:
    - 'main'
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      # Clippy does not link, so the AFL fuzz binary needs no cargo-afl here.
      - name: Clippy (no features)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Docs
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    needs: lints
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        toolchain:
        - 1.85.0 # MSRV
        - stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      # The AFL fuzz binary only links under cargo-afl.
      - name: Test (no features)
        run: cargo test --locked --workspace --exclude rrule-afl-fuzz
      - name: Test (all features)
        run: cargo test --locked --workspace --exclude rrule-afl-fuzz --all-features

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
